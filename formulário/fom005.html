<!DOCTYPE html>

<body>
    <h1>exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>sexo</legend>
            <input type="radio" name="sxmas" id="sexo"> <label for="isxmas"> masculino</label> <br>
            <input type="radio" nome="sxfen" id="sexo"> <label for="isxfen"> feminino</label> <br>
        </fieldset>

        <fieldset>
            <legend>esporte favoritos</legend>
            <input type="checkbox" nome="esbas" id="iesbas"> <label for="iesbas"> basquete</label> <br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat"> natação</label> <br>
            <input type="checkbox" nome="esten" id="iesten"> <label for="iesten" checked> tenis</label> <br>

            </fieldset>

                <input type="reset" value="linpar">
