<!DOCTYPE html>
<html lang="pt br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title>
</head>

<body>
    <h1> teste de formulário</h1>
    <form action="cadastro.php" method="post" outocomplete="on" >
        <p>
            <label for="iusu"> usuário:</label>
            <input type="text" nome="usu" id="iusu" required minlength="5"
            maxlength="15" size="20" placeholder="nome do usuario" autocomplete="username" >
        </p>
        <p>
            <label for="isen"> senha:</label>
            <input type="password" nome="sen" id="isen" required minlength="8" size="20"
            placeholder="digite sua senhar" autocomplete="current-password">
        </p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">

    </form>

</body>

</html>
